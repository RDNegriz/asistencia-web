services:
  frontend:
    build: ./frontend
    container_name: laboratorio-frontend
    expose:
      - "80"
    networks:
      - laboratorio_net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: laboratorio-backend
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=labo
      - DB_PASS=labo123
      - DB_NAME=laboratorio
    depends_on:
      - db
    networks:
      - laboratorio_net
    restart: unless-stopped

  proxy:
    image: nginx:latest
    container_name: laboratorio-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - laboratorio_net
    restart: unless-stopped

  db:
    image: mariadb:latest
    container_name: laboratorio-db
    environment:
      - MARIADB_ROOT_PASSWORD=1234
      - MARIADB_DATABASE=laboratorio
      - MARIADB_USER=labo
      - MARIADB_PASSWORD=labo123
    volumes:
      - ./db/data:/var/lib/mysql
    networks:
      - laboratorio_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: laboratorio-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - laboratorio_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: laboratorio-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - laboratorio_net
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: laboratorio-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks:
      - laboratorio_net
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: laboratorio-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    ports:
      - "9100:9100"
    networks:
      - laboratorio_net
    restart: unless-stopped

networks:
  laboratorio_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: