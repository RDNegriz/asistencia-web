services:
  backend:
    build: ./backend
    container_name: laboratorio-backend
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=labo
      - DB_PASS=labo123
      - DB_NAME=laboratorio
    depends_on:
      - db
    networks:
      - laboratorio_net
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: laboratorio-nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - laboratorio_net
    restart: unless-stopped

  db:
    image: mariadb:latest
    container_name: laboratorio-db
    environment:
      - MARIADB_ROOT_PASSWORD=1234
      - MARIADB_DATABASE=laboratorio
      - MARIADB_USER=labo
      - MARIADB_PASSWORD=labo123
    volumes:
      - ./db/data:/var/lib/mysql
    networks:
      - laboratorio_net
    restart: unless-stopped

networks:
  laboratorio_net:
    driver: bridge
